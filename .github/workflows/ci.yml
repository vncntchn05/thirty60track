name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Deterministic local-stack credentials. `supabase start` always returns these
  # same values for a fresh stack started with the CLI's default JWT secret, so
  # we can hard-code them as build-time inputs for the web export.
  LOCAL_SUPABASE_URL: 'http://127.0.0.1:54321'
  LOCAL_SUPABASE_DB_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'

jobs:
  # ─── Path filter: decides which downstream jobs are even needed ───────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend:    ${{ steps.filter.outputs.backend }}
      frontend:   ${{ steps.filter.outputs.frontend }}
      e2e:        ${{ steps.filter.outputs.e2e }}
      ci:         ${{ steps.filter.outputs.ci }}
      docs_only:  ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 'docs_only' is the negation: true when *only* markdown/text files changed.
          predicate-quantifier: 'every'
          filters: |
            backend:
              - 'supabase/**'
              - 'scripts/**'
              - 'hooks/**'
              - 'lib/**'
              - 'types/**'
              - '__tests__/integration/**'
              - 'package*.json'
            frontend:
              - 'app/**'
              - 'components/**'
              - 'constants/**'
              - 'hooks/**'
              - 'lib/**'
              - 'assets/**'
              - 'app.json'
              - 'package*.json'
            e2e:
              - 'e2e/**'
              - 'playwright.config.*'
            ci:
              - '.github/workflows/**'
            docs_only:
              - '!**/*.md'
              - '!docs/**'

  # ─── Lint & type-check — fast, always runs ───────────────────────────────
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck

  # ─── Unit tests — mocked Supabase, ~1 min ────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes, lint-and-typecheck]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run unit tests
        run: npm run test:ci -- --testPathIgnorePatterns=__tests__/integration
      - name: Coverage (advisory)
        if: github.event_name == 'pull_request'
        run: npm run test:coverage -- --testPathIgnorePatterns=__tests__/integration
        continue-on-error: true
      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── Integration tests — local Supabase stack ────────────────────────────
  integration-tests:
    name: Integration Tests (local Supabase)
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci      == 'true'
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'
      EXPO_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
      TEST_TRAINER_EMAIL: trainer@thirty60test.dev
      TEST_CLIENT_EMAIL: client@thirty60test.dev
      TEST_TRAINER_PASSWORD: ${{ secrets.TEST_TRAINER_PASSWORD || 'trainer-ci-pw-1234' }}
      TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD || 'client-ci-pw-1234' }}
      TEST_CLIENT_ID: cccccccc-0000-4000-c000-000000000003
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Supabase CLI binary
        id: cache-supabase
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/supabase
          key: supabase-cli-${{ runner.os }}-v1.200.3

      - name: Install Supabase CLI
        if: steps.cache-supabase.outputs.cache-hit != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.3

      - name: Cache npm + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: node-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --legacy-peer-deps

      - name: Start local Supabase
        run: |
          # Patches live in supabase/sql_migrations/ (hidden from the CLI's
          # auto-apply path), so `supabase start` boots a clean DB. We apply
          # schema.sql + migrate.sh explicitly below.
          supabase start --exclude studio,inbucket,imgproxy,storage-api,edge-runtime

          STATUS_JSON=$(supabase status -o env)
          echo "$STATUS_JSON" | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS_JSON" | sed -n 's/^ANON_KEY=//p')" >> $GITHUB_ENV
          echo "SUPABASE_URL=$(echo "$STATUS_JSON" | sed -n 's/^API_URL=//p')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | sed -n 's/^SERVICE_ROLE_KEY=//p')" >> $GITHUB_ENV

      - name: Apply source-of-truth schema (schema.sql)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Apply migrations (scripts/migrate.sh against local DB)
        run: |
          chmod +x scripts/migrate.sh
          ./scripts/migrate.sh

      - name: Migration status report
        run: |
          chmod +x scripts/check-migrations.sh
          ./scripts/check-migrations.sh

      - name: Seed exercise library + CI/CD fixture data
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed_cicd.sql

      - name: Create test auth users (scripts/create-test-users.sh)
        run: |
          chmod +x scripts/create-test-users.sh
          ./scripts/create-test-users.sh

      - name: Run integration tests
        run: npm run test:integration

      - name: Dump Supabase logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps --format '{{.Names}}' | grep -i supabase | while read name; do
            docker logs "$name" > "artifacts/$name.log" 2>&1 || true
          done

      - name: Upload Supabase logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-logs-integration
          path: artifacts/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ─── E2E tests — Playwright against local Supabase + Expo Web export ─────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend  == 'true' ||
      needs.changes.outputs.e2e      == 'true' ||
      needs.changes.outputs.ci       == 'true'
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'
      EXPO_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
      TEST_TRAINER_EMAIL: trainer@thirty60test.dev
      TEST_CLIENT_EMAIL: client@thirty60test.dev
      TEST_TRAINER_PASSWORD: ${{ secrets.TEST_TRAINER_PASSWORD || 'trainer-ci-pw-1234' }}
      TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD || 'client-ci-pw-1234' }}
      TEST_CLIENT_ID: cccccccc-0000-4000-c000-000000000003
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Supabase CLI binary
        id: cache-supabase
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/supabase
          key: supabase-cli-${{ runner.os }}-v1.200.3

      - name: Install Supabase CLI
        if: steps.cache-supabase.outputs.cache-hit != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.3

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: |
          supabase start --exclude studio,inbucket,imgproxy,storage-api,edge-runtime

          STATUS_JSON=$(supabase status -o env)
          echo "$STATUS_JSON" | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS_JSON" | sed -n 's/^ANON_KEY=//p')" >> $GITHUB_ENV
          echo "SUPABASE_URL=$(echo "$STATUS_JSON" | sed -n 's/^API_URL=//p')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | sed -n 's/^SERVICE_ROLE_KEY=//p')" >> $GITHUB_ENV

      - name: Apply schema + migrations + seed + test users
        run: |
          chmod +x scripts/migrate.sh scripts/create-test-users.sh
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          ./scripts/migrate.sh
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed_cicd.sql
          ./scripts/create-test-users.sh

      - name: Build Expo Web export (against local Supabase)
        run: npx expo export --platform web
        env:
          CI: true

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # The Playwright config's webServer block serves dist/ on this URL.
          PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:4173'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ─── Production-config build smoke test ──────────────────────────────────
  build-check:
    name: Expo Web Build (prod config)
    runs-on: ubuntu-latest
    needs: [changes, lint-and-typecheck]
    if: needs.changes.outputs.docs_only != 'true'
    env:
      EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx expo export --platform web
        env:
          CI: true

  # ─── Aggregate gate ──────────────────────────────────────────────────────
  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests, e2e-tests, build-check]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          # 'skipped' counts as a pass — path filter intentionally skips heavy
          # work when paths don't warrant it. Only explicit failures fail the gate.
          fail=0
          for r in \
            "${{ needs.lint-and-typecheck.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.integration-tests.result }}" \
            "${{ needs.e2e-tests.result }}" \
            "${{ needs.build-check.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "Job result: $r"; fail=1 ;;
            esac
          done
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "All required CI jobs passed or were intentionally skipped."
