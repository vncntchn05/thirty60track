# supabase/config.toml — minimal config for local CLI use.
#
# Our schema lives in `supabase/schema.sql` (source of truth) and our patches
# in `supabase/sql_migrations/` + `supabase/migration_*.sql`. Neither path is
# what the Supabase CLI auto-discovers, and `supabase/seed.sql` deliberately
# isn't auto-loaded either — it expects schema.sql to have run first.
#
# Everything else uses CLI defaults; this file exists solely to opt out of
# the auto-apply behaviour during `supabase start`.

project_id = "thirty60track"

# Note: we don't set [db.migrations] schema_paths here even though it would be
# the more explicit form — that key was added in Supabase CLI v2.x and our
# pinned CI version (v1.200.3) errors on unknown fields. Since the patch files
# live in supabase/sql_migrations/ (not the CLI-default supabase/migrations/),
# the CLI naturally finds nothing to auto-apply.

[db.seed]
# Our seed.sql + seed_cicd.sql are applied manually via psql after schema.sql.
enabled = false
